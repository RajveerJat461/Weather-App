<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weat.css">
    
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false"> 
<button><img src="search-interface-symbol.png" ></button>
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather">
            <img src="heavy-rain.png" class="Weather-icon">
            <h1 class="temp">40°c</h1>
            <h2 class="city-name"> New York</h2>
            <div class="detail">
                <div class="col side" >
                    <img src="humidity.png" alt="" srcset="">
                    <div>
                        <p  class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                    <div class="col">
                    <img src="wind.png" alt="" srcset="">
                    <div>
                        <p  class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="weather.js">
</script>
</html>
